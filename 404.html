<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Suay · Developer Portfolio</title>
  <script>
    var l = window.location;
    var base = '/suay-dev';
    // Strip base prefix to get just the route segment, then store it
    var segment = l.pathname.slice(base.length) || '/';
    sessionStorage.setItem('spa_redirect', segment + l.search + l.hash);
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/');
  </script>
</head>
<body></body>
</html>
